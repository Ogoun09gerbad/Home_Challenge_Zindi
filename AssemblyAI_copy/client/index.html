<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Test client — Streaming transcription</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.25rem; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] { flex: 1; padding: 6px 8px; font-family: monospace; }
  button { padding: 8px 16px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  #status { font-weight: bold; }
  #status.connected { color: #0a7d2c; }
  #status.disconnected { color: #b00020; }
  #partial { min-height: 1.5em; color: #888; font-style: italic; margin: 12px 0; }
  #finalLog { border: 1px solid #ddd; border-radius: 6px; padding: 12px; min-height: 200px; white-space: pre-wrap; }
  .segment { margin-bottom: 6px; }
  .speaker { color: #555; font-size: 0.8em; margin-right: 6px; }
</style>
</head>
<body>

<h1>Test client — Streaming speech transcription</h1>

<div class="row">
  <input type="text" id="wsUrl" value="ws://localhost:8000/ws/transcribe" />
</div>
<div class="row">
  <input type="text" id="jwtToken" placeholder="JWT token (?token= parameter)" />
</div>

<div class="row">
  <button id="btnStart">🎙️ Start</button>
  <button id="btnStop" disabled>⏹️ Stop</button>
  <span id="status" class="disconnected">Disconnected</span>
</div>

<div id="partial"></div>
<div id="finalLog"></div>

<script>
/**
 * Minimal client: captures the microphone via the Web Audio API, resamples
 * (if needed) to 16 kHz mono, converts each block to 16-bit linear PCM
 * (little-endian), and sends these binary packets as ~100 ms WebSocket
 * frames to the transcription server.
 *
 * Capture/conversion runs in an AudioWorkletProcessor (dedicated audio
 * thread, off the main thread) so it never blocks the UI and guarantees a
 * steady stream, a prerequisite for the target latency (<300ms).
 */

const SAMPLE_RATE = 16000;       // Hz — required by the server
const CHUNK_DURATION_MS = 100;   // size of packets sent (50-100 ms)
const SAMPLES_PER_CHUNK = (SAMPLE_RATE * CHUNK_DURATION_MS) / 1000; // 1600

// AudioWorkletProcessor code, injected as a module via a Blob URL in order
// to keep this client as a single self-contained HTML file.
const WORKLET_SOURCE = `
class PcmCaptureProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this._buffer = new Float32Array(${SAMPLES_PER_CHUNK});
    this._writeIndex = 0;
  }

  process(inputs) {
    const input = inputs[0];
    if (!input || input.length === 0) return true;
    const channelData = input[0]; // mono: only one channel is used

    for (let i = 0; i < channelData.length; i++) {
      this._buffer[this._writeIndex++] = channelData[i];

      if (this._writeIndex >= this._buffer.length) {
        // Float32 [-1, 1] -> little-endian Int16 PCM conversion, as
        // expected by the server (server/session_manager.py).
        const int16 = new Int16Array(this._buffer.length);
        for (let j = 0; j < this._buffer.length; j++) {
          const s = Math.max(-1, Math.min(1, this._buffer[j]));
          int16[j] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        this.port.postMessage(int16.buffer, [int16.buffer]);
        this._writeIndex = 0;
      }
    }
    return true;
  }
}
registerProcessor('pcm-capture-processor', PcmCaptureProcessor);
`;

let audioContext = null;
let mediaStream = null;
let workletNode = null;
let sourceNode = null;
let socket = null;

const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const statusEl = document.getElementById('status');
const partialEl = document.getElementById('partial');
const finalLogEl = document.getElementById('finalLog');

function setStatus(connected) {
  statusEl.textContent = connected ? 'Connected' : 'Disconnected';
  statusEl.className = connected ? 'connected' : 'disconnected';
}

function appendFinalSegment(text, speakerId) {
  const div = document.createElement('div');
  div.className = 'segment';
  div.innerHTML = `<span class="speaker">Speaker ${speakerId}:</span>${text}`;
  finalLogEl.appendChild(div);
  finalLogEl.scrollTop = finalLogEl.scrollHeight;
}

async function start() {
  const wsUrl = document.getElementById('wsUrl').value.trim();
  const token = document.getElementById('jwtToken').value.trim();
  const fullUrl = `${wsUrl}?token=${encodeURIComponent(token)}`;

  // 1) WebSocket connection. The server validates the JWT during the
  //    handshake: if the token is invalid, the connection will close
  //    immediately with code 1008.
  socket = new WebSocket(fullUrl);
  socket.binaryType = 'arraybuffer';

  socket.onopen = () => setStatus(true);
  socket.onclose = (event) => {
    setStatus(false);
    if (event.code === 1008) {
      partialEl.textContent = `Authentication rejected: ${event.reason}`;
    }
    stopCapture();
  };
  socket.onerror = () => setStatus(false);

  socket.onmessage = (event) => {
    const message = JSON.parse(event.data);
    if (message.status === 'partial') {
      partialEl.textContent = message.text;
    } else if (message.status === 'final') {
      partialEl.textContent = '';
      appendFinalSegment(message.text, message.speaker_id);
    }
  };

  // 2) Microphone capture.
  mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: 1,
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    },
  });

  // Request a 16 kHz AudioContext directly: modern browsers (Chrome,
  // Firefox, Edge) transparently perform the necessary hardware/software
  // resampling.
  audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });

  const workletBlobUrl = URL.createObjectURL(
    new Blob([WORKLET_SOURCE], { type: 'application/javascript' })
  );
  await audioContext.audioWorklet.addModule(workletBlobUrl);

  sourceNode = audioContext.createMediaStreamSource(mediaStream);
  workletNode = new AudioWorkletNode(audioContext, 'pcm-capture-processor');

  workletNode.port.onmessage = (event) => {
    // event.data is an ArrayBuffer containing the chunk's 16-bit PCM.
    if (socket.readyState === WebSocket.OPEN) {
      socket.send(event.data);
    }
  };

  sourceNode.connect(workletNode);
  // The worklet produces no audible output meant for the speakers, so it
  // is NOT connected to audioContext.destination (avoids audio feedback).

  btnStart.disabled = true;
  btnStop.disabled = false;
}

function stopCapture() {
  if (workletNode) { workletNode.disconnect(); workletNode = null; }
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  if (mediaStream) { mediaStream.getTracks().forEach((t) => t.stop()); mediaStream = null; }
  if (audioContext) { audioContext.close(); audioContext = null; }
  if (socket && socket.readyState === WebSocket.OPEN) { socket.close(); }

  btnStart.disabled = false;
  btnStop.disabled = true;
}

btnStart.addEventListener('click', () => start().catch((err) => {
  console.error(err);
  alert(`Error during startup: ${err.message}`);
  stopCapture();
}));
btnStop.addEventListener('click', stopCapture);
</script>

</body>
</html>
